[package]
name = "ancymon"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
chrono = "0.4"
cron = "0.15"
icalendar = { version = "0.17", features = ["chrono-tz"] }
openssl = { version = "0.10", features = ["vendored"] }
regex = "1.12"
reqwest = "0.13"
rrule = "0.14"
serde = { version = "1.0", features = ["derive"] }
serenity = { version = "0.12", features = ["client", "gateway", "rustls_backend", "model"] }
sqlx = { version = "0.8", features = ["any", "runtime-tokio-native-tls", "sqlite"]}
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono"] }
